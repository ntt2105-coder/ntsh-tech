<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>南投高中技職探索課程導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 全螢幕 3D 舞台;左上標題、右側(手機為底部)資訊卡、底部營隊清單列 */
:root {
  --sky1: #a9dcf2;
  --sky2: #e8f6f4;
  --ink: #0f3446;
  --muted: #4a6b79;
  --panel: rgba(255, 255, 255, 0.9);
  --line: rgba(15, 52, 70, 0.14);
  --accent: #c95207;
  --on-accent: #ffffff;
  --teal: #0f7f73;
  --chip: rgba(255, 255, 255, 0.82);
  --font-display: "Chiron GoRound TC", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky1: #0b2236; --sky2: #1f4d5e; --ink: #e8f5f6; --muted: #a3c3cb;
    --panel: rgba(10, 30, 44, 0.9); --line: rgba(232, 245, 246, 0.18);
    --accent: #ff9a52; --on-accent: #1a1007; --teal: #5fd6c4; --chip: rgba(10, 30, 44, 0.78);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky1: #0b2236; --sky2: #1f4d5e; --ink: #e8f5f6; --muted: #a3c3cb;
  --panel: rgba(10, 30, 44, 0.9); --line: rgba(232, 245, 246, 0.18);
  --accent: #ff9a52; --on-accent: #1a1007; --teal: #5fd6c4; --chip: rgba(10, 30, 44, 0.78);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky2); color: var(--ink); font-family: var(--font-body); overflow: hidden; position: relative; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#stage { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1), var(--sky2)); }
#gl { display: block; width: 100%; height: 100%; touch-action: none; }
#pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.pin {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 3px 10px 3px 3px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--chip); font-size: 12px; font-weight: 700; backdrop-filter: blur(6px);
  will-change: transform;
}
.pin .n, .chip .n {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  font-size: 12px; font-weight: 800; color: #fff; background: var(--c); flex: none;
}
.pin.on { background: var(--accent); color: var(--on-accent); border-color: transparent; z-index: 2; }

.ui {
  position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 16px;
}
.ui > * { pointer-events: auto; }
header { align-self: flex-start; max-width: 100%; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: var(--teal); }
h1 { margin: 2px 0 4px; font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4.6vw, 34px); line-height: 1.15; text-wrap: balance; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.mid { position: relative; flex: 1; min-height: 0; pointer-events: none; }

.card {
  position: absolute; right: 0; top: 8px; width: min(360px, 100%); max-height: 100%;
  overflow-y: auto; pointer-events: auto; padding: 18px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(8, 40, 60, 0.18);
}
.card .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.card .tag i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.card h2 { margin: 6px 0 6px; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.25; text-wrap: balance; }
.card .blurb { margin: 0 0 12px; font-size: 15px; line-height: 1.6; }
.card h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.14em; color: var(--teal); }
.card ul { margin: 0 0 14px; padding-left: 1.2em; font-size: 14px; line-height: 1.7; }
.card .signup { margin: 0 0 14px; font-size: 15px; line-height: 1.7; }
.card .signup a { color: var(--accent); font-weight: 700; }
.card dl { margin: 0 0 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.card .go {
  display: block; text-align: center; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px;
  background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none;
}
.card .nav { display: flex; gap: 8px; flex-wrap: wrap; }
.card .nav button {
  flex: 1 1 0; min-width: 0; padding: 8px 10px; border-radius: 10px; font-size: 13px; font-weight: 700;
  background: transparent; border: 1px solid var(--line);
}
.card .x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 18px; line-height: 1; }

.chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px 5px 5px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--chip); font-size: 14px; font-weight: 700;
  backdrop-filter: blur(6px);
}
.chip.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }

@media (max-width: 640px) {
  .card { right: 0; left: 0; top: auto; bottom: 4px; width: auto; max-height: 56%; padding: 16px; }
  .pin .nm { display: none; }
  .pin { padding: 3px; }
  .pin.on { padding: 3px 10px 3px 3px; }
  .pin.on .nm { display: inline; }
  .hint { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl" aria-label="南投高中技職探索課程導覽 3D 場景"></canvas>
  <div id="pins"></div>
</div>
<div class="ui">
  <header>
    <div class="eyebrow">國中二、三年級 ・ 8 個探索營</div>
    <h1>南投高中技職探索課程導覽</h1>
    <p class="hint">拖曳旋轉・滾輪或雙指縮放・點選建築看營隊</p>
  </header>
  <div class="mid"><section class="card" id="card" hidden aria-live="polite"></section></div>
  <nav class="chips" id="chips" aria-label="探索營清單"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 營隊資料(可直接修改)===== */
const SIGNUP = { unit: '南投高中實習處', tel: '049-2231175', ext: '601' };
const CAMPS = [
  { dept: '電機科', title: '智慧機器人探索營', color: '#e8650f',
    blurb: '用電與程式,讓機器人動起來。',
    items: ['機器人特色課程介紹', '輪型機器人闖關競賽', '人形機器人操控體驗', '機械手臂無人工廠體驗', '創意電機製作課程'] },
  { dept: '電子科', title: '物聯網探索營', color: '#1f9d8a',
    blurb: '讓日常物品連上網路,自己收集數據。',
    items: ['物聯網應用體驗', '微電腦程式設計', '電子電路製作', '智慧家庭生活體驗'] },
  { dept: '電腦機械製圖科', title: '3D繪圖設計探索營', color: '#2b78c2',
    blurb: '從螢幕上的設計,到手上的成品。',
    items: ['介紹電腦機械製圖與創意設計的關聯性', '雷射雕刻設計應用課程', '繪圖建模與 3D 列印課程', '療癒幾何圖形設計體驗課程'] },
  { dept: '建築科', title: '建築技術與設計探索營', color: '#c98a00',
    blurb: '從平面圖到立體模型,體驗蓋房子的第一步。',
    items: ['介紹建築與生活的關聯性', '建築環境模型製作課程', '住宅建築環境設計繪圖課程', '馬賽克磁磚拼貼設計體驗課程', '水泥混凝土創意灌模體驗課程', '建築 3D 電腦繪圖體驗課程'] },
  { dept: '美工科', title: '玩轉數位創客探索營', color: '#c0407a',
    blurb: '結合設計與數位工具,做出自己的作品。',
    items: ['設計美學與概念:探索 IP 角色設計、視覺傳達與色彩計畫基礎', '數位電繪體驗:運用專業繪圖板與軟體進行電繪創作', '數位創客應用:學習雷射切割向量設定與熱轉印印前完稿實務', '文創商品實作:親手產出動漫徽章、雷雕鑰匙圈及個性 T 恤等個人品牌周邊'] },
  { dept: '電子商務科', title: '新興科技智慧電商探索營', color: '#0f8f8f',
    blurb: '看新科技如何改變買賣與行銷。',
    items: ['門市服務實務', '無人商店體驗', 'VR 虛擬校園導覽體驗', '新興科技 IoT 商店體驗', 'AI 導覽機器人體驗', 'App Inventor 程式設計', 'Line 動態貼圖製作'] },
  { dept: '應用英語科', sub: 'AI跨域英日語實驗班', title: 'AI玩轉英日文探索營', color: '#6a4fc4',
    blurb: '讓 AI 陪你玩轉英文與日文。',
    items: ['外籍老師帶你運用 AI 玩轉英語文化', 'AI 助攻日語學習,挑戰生活會話', 'AI 創意設計 x 日式文化 DIY 手作'] },
  { dept: '自然科', title: '咖啡科學探索營', color: '#8a5a3a',
    blurb: '從咖啡烘焙到沖泡的科學探究。',
    items: ['咖啡豆在烘焙過程的變化', '咖啡烘焙的關鍵因素與影響', '認識與觀察淺焙、中焙、深焙的咖啡豆', '介紹咖啡沖泡與粉狀顆粒的關係', '感官體驗咖啡特性'] }
];

/* ===== 場景基礎 ===== */
const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 300);

const hemi = new THREE.HemisphereLight(0xffffff, 0x9fd8c8, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 0.9);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left = -16; sc.right = 16; sc.top = 16; sc.bottom = -16; sc.near = 1; sc.far = 80;
sun.shadow.bias = -0.0005;
scene.add(sun);

const matCache = {};
function mat(c, o) {
  const k = c + (o ? JSON.stringify(o) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: 0.9, metalness: 0 }, o || {})));
}
function mk(geo, c, o) { const m = new THREE.Mesh(geo, mat(c, o)); m.castShadow = true; m.receiveShadow = true; return m; }
function box(g, w, h, d, c, x, y, z, o) { const m = mk(new THREE.BoxGeometry(w, h, d), c, o); m.position.set(x, y + h / 2, z); g.add(m); return m; }
function cyl(g, rt, rb, h, seg, c, x, y, z, o) { const m = mk(new THREE.CylinderGeometry(rt, rb, h, seg), c, o); m.position.set(x, y + h / 2, z); g.add(m); return m; }
function cone(g, r, h, seg, c, x, y, z, o) { const m = mk(new THREE.ConeGeometry(r, h, seg), c, o); m.position.set(x, y + h / 2, z); g.add(m); return m; }
function sph(g, r, c, x, y, z, det, o) { const m = mk(new THREE.IcosahedronGeometry(r, det === undefined ? 1 : det), c, o); m.position.set(x, y, z); g.add(m); return m; }
function tor(g, R, t, c, x, y, z, arc, o) { const m = mk(new THREE.TorusGeometry(R, t, 6, 18, arc || Math.PI * 2), c, o); m.position.set(x, y, z); g.add(m); return m; }
function grp(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); parent.add(g); return g; }

const tickers = [];
const redraws = [];
function textTex(draw, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  redraws.push(() => { x.clearRect(0, 0, w, h); draw(x, w, h); t.needsUpdate = true; });
  return t;
}
const FONT = '"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => redraws.forEach(f => f()));
setTimeout(() => redraws.forEach(f => f()), 2000);

/* ===== 島嶼本體 ===== */
const island = new THREE.Group(); scene.add(island);
const grass = mk(new THREE.CylinderGeometry(11.5, 11, 1, 10), '#6cc3a0'); grass.position.y = -0.5; island.add(grass);
const dirt = mk(new THREE.CylinderGeometry(11, 10.5, 0.7, 10), '#a97f55'); dirt.position.y = -1.35; island.add(dirt);
const rock1 = mk(new THREE.ConeGeometry(10.5, 6, 10), '#7d8b92'); rock1.rotation.x = Math.PI; rock1.position.y = -4.7; island.add(rock1);
const rock2 = mk(new THREE.ConeGeometry(6, 5, 7), '#6a777e'); rock2.rotation.x = Math.PI; rock2.position.set(0.8, -8.4, -0.5); island.add(rock2);

/* 中央廣場與校門 */
cyl(island, 3.2, 3.2, 0.12, 24, '#efe6d2', 0, 0, 0);
const ring = tor(island, 2.6, 0.05, '#ff8a3d', 0, 0.14, 0); ring.rotation.x = Math.PI / 2;
const gate = grp(island, 0, 0.12, 0);
box(gate, 0.5, 2.4, 0.5, '#ffffff', -1.4, 0, 0);
box(gate, 0.5, 2.4, 0.5, '#ffffff', 1.4, 0, 0);
box(gate, 3.9, 0.6, 0.7, '#1f9d8a', 0, 2.4, 0);
box(gate, 4.3, 0.15, 1.0, '#ff8a3d', 0, 3.0, 0);
const gateTex = textTex((x, w, h) => {
  x.fillStyle = '#ffffff'; x.font = '700 ' + Math.round(h * 0.62) + 'px ' + FONT;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('南投高中', w / 2, h / 2 + 4);
}, 512, 96);
[[0.36, 0], [-0.36, Math.PI]].forEach(([z, ry]) => {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.5), new THREE.MeshBasicMaterial({ map: gateTex, transparent: true }));
  p.position.set(0, 2.7, z); p.rotation.y = ry; gate.add(p);
});
/* 旗桿與旗幟 */
const pole = grp(island, 2.6, 0.12, -1.0);
cyl(pole, 0.05, 0.07, 4.4, 6, '#c9d6dc', 0, 0, 0);
sph(pole, 0.12, '#ff8a3d', 0, 4.5, 0, 1);
const flagTex = textTex((x, w, h) => {
  x.fillStyle = '#ff8a3d'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#ffffff'; x.lineWidth = 8; x.strokeRect(10, 10, w - 20, h - 20);
  x.fillStyle = '#ffffff'; x.font = '800 ' + Math.round(h * 0.38) + 'px ' + FONT;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('南投高中', w / 2, h / 2 + 3);
}, 384, 224);
const flagGeo = new THREE.PlaneGeometry(1.8, 1.05, 10, 6); flagGeo.translate(0.9, 0, 0);
const flag = new THREE.Mesh(flagGeo, new THREE.MeshBasicMaterial({ map: flagTex, side: THREE.DoubleSide }));
flag.position.set(0, 3.8, 0); pole.add(flag);
const flagOrig = Float32Array.from(flagGeo.attributes.position.array);
tickers.push(t => {
  const p = flagGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = flagOrig[i * 3];
    p.setZ(i, Math.sin(x * 3 - t * 4) * 0.14 * (x / 1.8));
  }
  p.needsUpdate = true;
});

/* 小溪(環繞廣場) */
const stream = new THREE.Mesh(new THREE.RingGeometry(4.2, 4.9, 48), new THREE.MeshStandardMaterial({ color: '#5ec3e8', transparent: true, opacity: 0.9, roughness: 0.4 }));
stream.rotation.x = -Math.PI / 2; stream.position.y = 0.03; stream.receiveShadow = true; island.add(stream);

/* 周邊:山、茶園、樹 */
function mountain(a, rr, s) {
  const g = grp(island, Math.cos(a) * rr, 0, Math.sin(a) * rr); g.scale.setScalar(s);
  cone(g, 1.8, 4.2, 6, '#2f8f7a', 0, 0, 0);
  cone(g, 1.2, 2.8, 6, '#3aa58c', 1.1, 0, 0.5);
  cone(g, 0.386, 0.9, 6, '#f4fbfb', 0, 3.3, 0);
}
function terrace(a, rr) {
  const g = grp(island, Math.cos(a) * rr, 0, Math.sin(a) * rr);
  [['#4aa66b', 2.0], ['#68c27a', 1.6], ['#4aa66b', 1.2], ['#68c27a', 0.8]].forEach(([c, r], i) => {
    cyl(g, r, r + 0.1, 0.4, 8, c, 0, i * 0.4, 0);
    const t = tor(g, r - 0.1, 0.05, '#2f7d4e', 0, i * 0.4 + 0.41, 0); t.rotation.x = Math.PI / 2;
  });
}
function tree(a, rr, s) {
  const g = grp(island, Math.cos(a) * rr, 0, Math.sin(a) * rr); g.scale.setScalar(s);
  cyl(g, 0.1, 0.14, 0.5, 5, '#8a5a3a', 0, 0, 0);
  cone(g, 0.5, 0.9, 6, '#2f9a6a', 0, 0.4, 0);
  cone(g, 0.38, 0.7, 6, '#3fae7a', 0, 0.9, 0);
}
const sizes = [1.0, 0.85, 1.15, 0.8];
for (let k = 0; k < 8; k++) {
  const a = k * Math.PI / 4;
  if (k % 2 === 0) mountain(a, 9.4, sizes[k / 2]); else terrace(a, 9.4);
  [-1, 1].forEach(sg => tree(a + sg * 0.27, 9.9, 0.8 + ((k * 3 + (sg > 0 ? 1 : 0)) % 4) * 0.12));
}

/* 雲 */
const cloudMat = new THREE.MeshStandardMaterial({ color: '#ffffff', flatShading: true, roughness: 1, transparent: true, opacity: 0.95 });
const clouds = [];
for (let i = 0; i < 6; i++) {
  const c = new THREE.Group(); const a = i * 1.05, r = 15 + (i % 3) * 3;
  [[0, 0, 0, 1], [1, -0.2, 0.3, 0.8], [-1, -0.1, -0.2, 0.75], [0.3, 0.4, 0, 0.6]].forEach(([x, y, z, s]) => {

}
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { e.preventDefault(); gDist = Math.min(80, Math.max(10, gDist * Math.exp(e.deltaY * 0.001))); idle = 0; }, { passive: false });
canvas.style.cursor = 'grab';

/* ===== 介面 ===== */
const pinsEl = document.getElementById('pins'), chipsEl = document.getElementById('chips'), cardEl = document.getElementById('card');
const pinEls = [], chipEls = [];
CAMPS.forEach((c, i) => {
  const pin = document.createElement('button'); pin.className = 'pin'; pin.style.setProperty('--c', c.color);
  pin.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="nm">' + c.dept + '</span>';
  pin.addEventListener('click', () => select(i)); pinsEl.appendChild(pin); pinEls.push(pin);
  const chip = document.createElement('button'); chip.className = 'chip'; chip.style.setProperty('--c', c.color);
  chip.innerHTML = '<span class="n">' + (i + 1) + '</span>' + c.dept;
  chip.addEventListener('click', () => select(i)); chipsEl.appendChild(chip); chipEls.push(chip);
});
function renderCard(i) {
  const c = CAMPS[i];
  cardEl.style.setProperty('--c', c.color);
  cardEl.innerHTML =
    '<button class="x" aria-label="關閉">×</button>' +
    '<div class="tag"><i></i>' + c.dept + (c.sub ? '(' + c.sub + ')' : '') + '</div>' +
    '<h2>' + c.title + '</h2><p class="blurb">' + c.blurb + '</p>' +
    '<h3>你會體驗</h3><ul>' + c.items.map(t => '<li>' + t + '</li>').join('') + '</ul>' +
    '<h3>報名資訊</h3><p class="signup">' + SIGNUP.unit + '<br><a href="tel:' + SIGNUP.tel.replace(/-/g, '') + ',' + SIGNUP.ext + '">' + SIGNUP.tel + ' #' + SIGNUP.ext + '</a></p>' +
    '<div class="nav"><button data-a="prev">上一個</button><button data-a="all">回全景</button><button data-a="next">下一個</button></div>';
  cardEl.querySelector('.x').addEventListener('click', closeCard);
  cardEl.querySelector('[data-a="prev"]').addEventListener('click', () => select((i + 7) % 8));
  cardEl.querySelector('[data-a="next"]').addEventListener('click', () => select((i + 1) % 8));
  cardEl.querySelector('[data-a="all"]').addEventListener('click', closeCard);
  cardEl.scrollTop = 0;
}
function mark() {
  pinEls.forEach((p, i) => p.classList.toggle('on', i === selected));
  chipEls.forEach((p, i) => { p.classList.toggle('on', i === selected); if (i === selected && p.scrollIntoView) { try { p.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); } catch (_) {} } });
  buildings.forEach((b, i) => { b.sel.visible = i === selected; });
}
function select(i) {
  selected = i; renderCard(i); cardEl.hidden = false; mark(); idle = 0;
  const b = buildings[i];
  gAz = Math.PI / 2 - b.th; gPol = 0.95; gDist = Math.max(14, baseDist * 0.5);
  gTgt.set(b.pos.x * 0.85, 1.2, b.pos.z * 0.85);
}
function closeCard() {
  selected = -1; cardEl.hidden = true; mark();
  gPol = 1.0; gDist = baseDist; gTgt.set(0, 0.5, 0);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && selected >= 0) closeCard(); });

/* ===== 主題 ===== */
function isDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme() {
  const d = isDark();
  hemi.intensity = d ? 0.5 : 0.9; hemi.color.set(d ? '#9fc4ff' : '#ffffff');
  sun.intensity = d ? 0.55 : 0.9; sun.color.set(d ? '#a8c8ff' : '#fff4e0');
  cloudMat.color.set(d ? '#7d9db0' : '#ffffff');
}
applyTheme();
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ===== 迴圈 ===== */
const clock = new THREE.Clock(); const v = new THREE.Vector3();
resize(); dist = gDist;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  idle += dt;
  if (selected < 0 && idle > 3 && !reduce && ptrs.size === 0) { az += dt * 0.07; gAz = az; }
  let d = ((gAz - az + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  az += d * 0.08; pol += (gPol - pol) * 0.08; dist += (gDist - dist) * 0.12; tgt.lerp(gTgt, 0.08);
  camera.position.set(tgt.x + dist * Math.sin(pol) * Math.sin(az), tgt.y + dist * Math.cos(pol), tgt.z + dist * Math.sin(pol) * Math.cos(az));
  camera.lookAt(tgt);
  tickers.forEach(f => f(t));
  buildings.forEach((b, i) => {
    const s = i === hovered || i === selected ? 1.06 : 1; b.scale += (s - b.scale) * 0.15; b.body.scale.setScalar(b.scale);
    b.body.position.y = i === selected ? Math.abs(Math.sin(t * 3)) * 0.1 : 0;
    if (b.sel.visible) b.sel.scale.setScalar(1 + Math.sin(t * 4) * 0.03);
  });
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  buildings.forEach((b, i) => {
    v.set(b.pos.x, b.labelY + 0.2, b.pos.z).project(camera);
    pinEls[i].style.transform = 'translate(' + ((v.x * 0.5 + 0.5) * w).toFixed(1) + 'px,' + ((-v.y * 0.5 + 0.5) * h).toFixed(1) + 'px) translate(-50%,-100%)';
  });
}
frame();
</script>
